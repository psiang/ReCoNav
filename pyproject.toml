[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconav"
version = "1.0.0"
description = "Reliable constrained long-horizon vision-and-language navigation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "shapely>=2.1,<3",
  "trimesh>=4,<5",
  "scipy>=1.12,<2",
  "plyfile>=1.1,<2",
  "pydantic>=2.7,<3",
  "z3-solver>=4.16,<5",
  "Pillow>=11,<13",
  "opencv-python-headless>=4.11,<5",
  "networkx>=3.2,<4",
]

[project.optional-dependencies]
models = ["google-genai==1.47.0", "openai>=2.48,<3", "transformers==5.5.4", "jinja2==3.1.6"]
formal-baselines = ["scikit-learn>=1.4", "matplotlib>=3.8", "tqdm>=4.66"]

[project.scripts]
reconav = "reconav.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reconav*"]

[tool.setuptools.package-data]
"reconav.benchmark" = ["protocols/*.json"]
"reconav.prompts" = ["scene_independent_semantics/*.txt", "semantic_grounding/*.txt", "semantic_repair/*.txt"]
"reconav.scene" = ["*.json"]
"reconav.baselines" = ["resources/*.txt", "resources/*.json", "resources/*.md", "gcvln/*.txt", "upstream.json", "patches/*.patch", "licenses/*/*"]
